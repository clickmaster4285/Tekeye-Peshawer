# TekEye — go2rtc (RTSP H.265 → WebRTC H.264)
# Windows: go2rtc.exe -config go2rtc.yaml
# Linux:   ./go2rtc -config go2rtc.yaml

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  candidates:
    - 127.0.0.1:8555
    # Add this machine's LAN IP for remote browsers, e.g.:
    # - 192.168.190.138:8555
  listen: ":8555"

ffmpeg:
  bin: ffmpeg

streams: {}

log:
  level: info
